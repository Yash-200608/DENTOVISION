[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dentovision"
version = "1.0.0"
description = "AI-assisted dental radiograph interpretation API (research prototype)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
